name: weather-now
description: Current weather and forecast for any latitude/longitude (via Open-Meteo, no key needed).
upstream:
  base_url: https://api.open-meteo.com
  path: /v1/forecast
  method: GET
  passthrough_params: [latitude, longitude, current, hourly, daily, timezone, forecast_days]
pricing:
  price_usdc: "0.0005"
  network: base
  asset: USDC
  pay_to: 0xREPLACE_ME_BEFORE_DEPLOY
limits:
  max_per_minute: 30
